  <text x="40" y="130" fill="#fff" font-family="monospace" font-size="14" text-anchor="middle">Re</text>
  
  <!-- Connection Arrow -->
  <path d="M 65 125 L 95 125" stroke="#666" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  
  <!-- CNN Layers -->
  <rect x="100" y="85" width="20" height="80" rx="2" fill="#00aaff" fill-opacity="0.2" stroke="#00aaff" stroke-width="1.5"/>
  <rect x="130" y="75" width="20" height="100" rx="2" fill="#00aaff" fill-opacity="0.4" stroke="#00aaff" stroke-width="1.5"/>
