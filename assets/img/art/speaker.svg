<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="3D-printed speaker cross-section — enclosure shell, driver and bass port">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#948b7a" stroke-opacity=".14" stroke-width="1"/>
    </pattern>
    <pattern id="infill" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#948b7a" stroke-opacity=".5" stroke-width="1.4"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- enclosure shell (section) -->
  <g>
    <path d="M240 100 h280 a20 20 0 0 1 20 20 v260 a20 20 0 0 1 -20 20 h-280 a20 20 0 0 1 -20 -20 v-260 a20 20 0 0 1 20 -20 z
             M258 118 h244 a10 10 0 0 1 10 10 v244 a10 10 0 0 1 -10 10 h-244 a10 10 0 0 1 -10 -10 v-244 a10 10 0 0 1 10 -10 z"
          fill="url(#infill)" fill-rule="evenodd" stroke="#948b7a" stroke-width="2.4"/>
  </g>
  <text x="228" y="80" font-family="'JetBrains Mono',monospace" font-size="13" letter-spacing="3" fill="#948b7a">SECTION A&#8211;A &#183; PLA SHELL</text>

  <!-- driver: magnet, basket, cone -->
  <rect x="286" y="196" width="44" height="68" rx="6" fill="none" stroke="#948b7a" stroke-width="2.2"/>
  <rect x="330" y="212" width="26" height="36" fill="none" stroke="#948b7a" stroke-width="2"/>
  <path d="M356 224 L470 168 M356 236 L470 292" stroke="#948b7a" stroke-width="2.2" fill="none"/>
  <path d="M470 168 Q488 230 470 292" stroke="#948b7a" stroke-width="2.2" fill="none"/>
  <path d="M356 224 L356 236" stroke="#948b7a" stroke-width="2.2"/>
  <text x="268" y="292" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="2" fill="#948b7a">DRIVER</text>

  <!-- driver opening in right wall -->
  <line x1="502" y1="164" x2="502" y2="296" stroke="#948b7a" stroke-opacity="0"/>

  <!-- bass port -->
  <path d="M380 400 L380 344 Q380 332 392 332 L470 332 Q482 332 482 344 L482 400" fill="none" stroke="#948b7a" stroke-width="2.2"/>
  <text x="366" y="426" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="2" fill="#948b7a">BASS PORT</text>

  <!-- damping -->
  <g stroke="#948b7a" stroke-opacity=".5" stroke-width="1.4" fill="none">
    <path d="M276 140 q10 8 20 0 q10 -8 20 0 q10 8 20 0"/>
    <path d="M276 160 q10 8 20 0 q10 -8 20 0 q10 8 20 0"/>
  </g>
  <text x="352" y="152" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="2" fill="#948b7a" fill-opacity=".8">DAMPING</text>

  <!-- terminals -->
  <circle cx="240" cy="330" r="6" fill="none" stroke="#948b7a" stroke-width="2"/>
  <circle cx="240" cy="352" r="6" fill="none" stroke="#948b7a" stroke-width="2"/>
  <line x1="246" y1="330" x2="286 " y2="252" stroke="#948b7a" stroke-opacity=".6" stroke-width="1.4" stroke-dasharray="4 5"/>
  <line x1="246" y1="352" x2="288" y2="260" stroke="#948b7a" stroke-opacity=".6" stroke-width="1.4" stroke-dasharray="4 5"/>
  <text x="150" y="346" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="2" fill="#948b7a">IN +/&#8722;</text>

  <!-- sound waves -->
  <g stroke="#ff5e1f" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M560 200 a44 44 0 0 1 0 60"/>
    <path d="M596 178 a74 74 0 0 1 0 104"/>
    <path d="M632 156 a104 104 0 0 1 0 148"/>
  </g>

  <!-- port air arrows -->
  <g stroke="#ff5e1f" stroke-opacity=".7" stroke-width="1.8" fill="none">
    <path d="M412 412 q4 14 -4 26 M431 412 q4 14 -4 26 M450 412 q4 14 -4 26"/>
  </g>

  <!-- print-layer callout -->
  <g stroke="#948b7a" stroke-opacity=".8" stroke-width="1.2">
    <line x1="520" y1="356" x2="560" y2="356"/><line x1="520" y1="362" x2="560" y2="362"/>
    <line x1="520" y1="368" x2="560" y2="368"/><line x1="520" y1="374" x2="560" y2="374"/>
  </g>
  <text x="572" y="372" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="2" fill="#948b7a">0.2 MM LAYERS</text>
</svg>
