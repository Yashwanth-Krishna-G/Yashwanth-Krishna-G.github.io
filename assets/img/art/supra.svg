<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Supra SAE formula-style car schematic — side profile with powertrain callouts">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#948b7a" stroke-opacity=".14" stroke-width="1"/>
    </pattern>
    <marker id="dim2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#948b7a"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- ground -->
  <line x1="60" y1="392" x2="740" y2="392" stroke="#948b7a" stroke-width="1.6"/>
  <g stroke="#948b7a" stroke-opacity=".6" stroke-width="1">
    <line x1="90"  y1="392" x2="76"  y2="406"/><line x1="150" y1="392" x2="136" y2="406"/>
    <line x1="210" y1="392" x2="196" y2="406"/><line x1="270" y1="392" x2="256" y2="406"/>
    <line x1="330" y1="392" x2="316" y2="406"/><line x1="390" y1="392" x2="376" y2="406"/>
    <line x1="450" y1="392" x2="436" y2="406"/><line x1="510" y1="392" x2="496" y2="406"/>
    <line x1="570" y1="392" x2="556" y2="406"/><line x1="630" y1="392" x2="616" y2="406"/>
    <line x1="690" y1="392" x2="676" y2="406"/><line x1="720" y1="392" x2="706" y2="406"/>
  </g>

  <!-- body -->
  <g stroke="#948b7a" stroke-width="2.2" fill="none" stroke-linejoin="round">
    <!-- nose + tub -->
    <path d="M92 340 Q88 322 108 318 L200 306 Q250 300 288 296 L320 258 Q330 246 348 244 L420 240 Q448 240 462 262 L488 296 L610 302 Q650 306 662 330 L668 348 Q670 362 654 364 L120 352 Q94 352 92 340 Z"/>
    <!-- roll hoop -->
    <path d="M430 240 L446 176 Q450 164 460 168 L474 236"/>
    <!-- head rest fairing -->
    <path d="M462 262 Q500 258 520 280 L540 298"/>
    <!-- cockpit opening -->
    <path d="M330 254 Q368 246 420 246" stroke-opacity=".8"/>
    <!-- side pod -->
    <path d="M492 300 L588 304 Q600 318 596 336 L500 332 Q488 316 492 300 Z" stroke-opacity=".85"/>
  </g>

  <!-- wheels -->
  <g fill="none" stroke="#948b7a">
    <circle cx="212" cy="344" r="48" stroke-width="2.4"/>
    <circle cx="212" cy="344" r="30" stroke-width="1.4" stroke-opacity=".7"/>
    <circle cx="212" cy="344" r="6"  fill="#948b7a"/>
    <circle cx="588" cy="344" r="48" stroke-width="2.4"/>
    <circle cx="588" cy="344" r="30" stroke-width="1.4" stroke-opacity=".7"/>
  </g>

  <!-- drive sprocket (accent) -->
  <circle cx="588" cy="344" r="18" fill="none" stroke="#ff5e1f" stroke-width="3" stroke-dasharray="4 3"/>
  <circle cx="588" cy="344" r="6" fill="#ff5e1f"/>
  <line x1="600" y1="330" x2="668" y2="252" stroke="#ff5e1f" stroke-width="1.2"/>
  <circle cx="668" cy="252" r="2.5" fill="#ff5e1f"/>
  <text x="620" y="240" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="2" fill="#ff5e1f">SPROCKET</text>

  <!-- chain run -->
  <path d="M570 330 Q540 316 522 318 M572 360 Q544 366 526 356" stroke="#ff5e1f" stroke-opacity=".6" stroke-width="1.6" stroke-dasharray="3 4" fill="none"/>

  <!-- engine + mounts (accent) -->
  <rect x="500" y="308" width="52" height="40" rx="6" fill="none" stroke="#ff5e1f" stroke-width="2"/>
  <circle cx="500" cy="348" r="4" fill="#ff5e1f"/>
  <circle cx="552" cy="348" r="4" fill="#ff5e1f"/>
  <line x1="512" y1="304" x2="446" y2="180" stroke="#ff5e1f" stroke-width="1.2" stroke-opacity="0"/>
  <line x1="524" y1="308" x2="500" y2="150" stroke="#ff5e1f" stroke-width="1.2"/>
  <circle cx="500" cy="150" r="2.5" fill="#ff5e1f"/>
  <text x="384" y="138" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="2" fill="#ff5e1f">ENGINE + MOUNTS</text>

  <!-- wheelbase dimension -->
  <line x1="212" y1="446" x2="588" y2="446" stroke="#948b7a" stroke-width="1.2" marker-start="url(#dim2)" marker-end="url(#dim2)"/>
  <line x1="212" y1="398" x2="212" y2="456" stroke="#948b7a" stroke-opacity=".5" stroke-width="1"/>
  <line x1="588" y1="398" x2="588" y2="456" stroke="#948b7a" stroke-opacity=".5" stroke-width="1"/>
  <text x="336" y="470" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="2" fill="#948b7a">WHEELBASE</text>

  <!-- title -->
  <text x="92" y="88" font-family="'JetBrains Mono',monospace" font-size="13" letter-spacing="3" fill="#948b7a">SUPRA SAE INDIA &#183; POWERTRAIN</text>
  <text x="92" y="110" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="2" fill="#948b7a" fill-opacity=".7">40+ CAD COMPONENTS &#183; SOLIDWORKS</text>
</svg>
