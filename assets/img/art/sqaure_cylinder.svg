<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Grid Pattern Definition -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#222" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background & Staggered Grid -->
  <rect width="800" height="500" fill="#121212" rx="15"/>
  <rect width="800" height="500" fill="url(#grid)" rx="15"/>

  <!-- Inlet Flow Lines -->
  <path d="M 0 170 L 120 170 M 0 210 L 100 210 M 0 250 L 100 250 M 0 290 L 100 290 M 0 330 L 120 330" stroke="#444" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Vortex 1 (Top - Negative Vorticity) -->
  <circle cx="280" cy="180" r="12" fill="#00aaff" opacity="0.9"/>
  <circle cx="280" cy="180" r="24" fill="#00aaff" opacity="0.6"/>
  <circle cx="280" cy="180" r="36" fill="#00aaff" opacity="0.3"/>
  <circle cx="280" cy="180" r="50" fill="#00aaff" opacity="0.1"/>

  <!-- Vortex 2 (Bottom - Positive Vorticity) -->
  <circle cx="430" cy="320" r="16" fill="#ff5a36" opacity="0.8"/>
  <circle cx="430" cy="320" r="32" fill="#ff5a36" opacity="0.5"/>
  <circle cx="430" cy="320" r="48" fill="#ff5a36" opacity="0.2"/>
  <circle cx="430" cy="320" r="66" fill="#ff5a36" opacity="0.08"/>

  <!-- Vortex 3 (Top) -->
  <circle cx="580" cy="180" r="20" fill="#00aaff" opacity="0.7"/>
  <circle cx="580" cy="180" r="40" fill="#00aaff" opacity="0.4"/>
  <circle cx="580" cy="180" r="60" fill="#00aaff" opacity="0.15"/>
  <circle cx="580" cy="180" r="80" fill="#00aaff" opacity="0.05"/>

  <!-- Vortex 4 (Bottom) -->
  <circle cx="730" cy="320" r="24" fill="#ff5a36" opacity="0.6"/>
  <circle cx="730" cy="320" r="48" fill="#ff5a36" opacity="0.3"/>
  <circle cx="730" cy="320" r="72" fill="#ff5a36" opacity="0.1"/>
  <circle cx="730" cy="320" r="96" fill="#ff5a36" opacity="0.04"/>

  <!-- Shear Layers Connecting Square to Wakes -->
  <path d="M 200 210 C 230 210, 250 180, 280 180" stroke="#00aaff" stroke-width="2" fill="none" opacity="0.8" stroke-dasharray="6,4"/>
  <path d="M 200 290 C 280 290, 360 320, 430 320" stroke="#ff5a36" stroke-width="2" fill="none" opacity="0.8" stroke-dasharray="6,4"/>

  <!-- Square Cylinder -->
  <rect x="120" y="210" width="80" height="80" fill="#111" stroke="#fff" stroke-width="3"/>
  
  <!-- Technical Typography -->
  <text x="160" y="340" fill="#aaa" font-family="monospace" font-size="14" text-anchor="middle">Re = 100</text>
  <text x="160" y="360" fill="#666" font-family="monospace" font-size="12" text-anchor="middle">VON KÁRMÁN WAKE</text>
</svg>
