<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Compliant bionic arm schematic — 3D-printed hand with flexure joints, tendon drive, servo and ESP32">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#948b7a" stroke-opacity=".14" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- ============ hand (pointing up), palm bottom-centre ============ -->
  <g stroke="#948b7a" stroke-width="2" fill="none" stroke-linejoin="round">
    <!-- palm -->
    <path d="M300 300 Q298 250 310 240 L470 240 Q484 252 482 300 L474 388 Q470 404 452 404 L330 404 Q312 404 308 388 Z"/>
    <!-- index -->
    <rect x="308" y="160" width="36" height="72" rx="10"/>
    <rect x="310" y="92"  width="32" height="60" rx="10"/>
    <!-- middle -->
    <rect x="354" y="150" width="36" height="82" rx="10"/>
    <rect x="356" y="74"  width="32" height="68" rx="10"/>
    <!-- ring -->
    <rect x="400" y="156" width="36" height="76" rx="10"/>
    <rect x="402" y="86"  width="32" height="62" rx="10"/>
    <!-- little -->
    <rect x="446" y="170" width="34" height="62" rx="10"/>
    <rect x="448" y="112" width="30" height="50" rx="10"/>
    <!-- thumb -->
    <path d="M300 296 Q258 288 240 256 Q228 232 246 220 Q262 210 280 230 Q296 248 306 262"/>
  </g>

  <!-- flexure joints (compliant hinges) -->
  <g stroke="#ff5e1f" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M312 152 q14 6 28 0"/>
    <path d="M358 146 q14 6 28 0"/>
    <path d="M404 150 q14 6 28 0"/>
    <path d="M450 166 q13 6 26 0"/>
    <path d="M310 236 q16 -6 32 0"/>
    <path d="M356 236 q16 -6 32 0"/>
    <path d="M402 236 q16 -6 32 0"/>
    <path d="M448 236 q15 -6 30 0"/>
  </g>
  <text x="508" y="150" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="2" fill="#ff5e1f">FLEXURE</text>
  <line x1="480" y1="163" x2="503" y2="148" stroke="#ff5e1f" stroke-width="1" stroke-opacity=".7"/>

  <!-- tendon route -->
  <path d="M326 100 L326 380 M372 84 L372 380 M418 94 L418 380 M462 120 L462 380" stroke="#ff5e1f" stroke-opacity=".55" stroke-width="1.4" stroke-dasharray="5 6" fill="none"/>
  <path d="M326 380 Q390 428 390 446 M372 380 Q390 420 390 446 M418 380 Q392 420 390 446 M462 380 Q392 428 390 446" stroke="#ff5e1f" stroke-opacity=".55" stroke-width="1.4" stroke-dasharray="5 6" fill="none"/>
  <text x="196" y="452" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="2" fill="#948b7a">TENDON &#8594;</text>

  <!-- servo pulley -->
  <circle cx="390" cy="452" r="17" fill="none" stroke="#948b7a" stroke-width="2"/>
  <circle cx="390" cy="452" r="5" fill="#948b7a"/>

  <!-- servo + esp32 blocks -->
  <rect x="540" y="330" width="120" height="52" rx="8" fill="none" stroke="#948b7a" stroke-width="2"/>
  <text x="562" y="361" font-family="'JetBrains Mono',monospace" font-size="13" letter-spacing="3" fill="#948b7a">SERVO</text>
  <rect x="540" y="410" width="120" height="52" rx="8" fill="none" stroke="#948b7a" stroke-width="2"/>
  <text x="562" y="441" font-family="'JetBrains Mono',monospace" font-size="13" letter-spacing="3" fill="#948b7a">ESP32</text>
  <g stroke="#948b7a" stroke-opacity=".7" stroke-width="1.5">
    <line x1="660" y1="344" x2="676" y2="344"/><line x1="660" y1="356" x2="676" y2="356"/><line x1="660" y1="368" x2="676" y2="368"/>
    <line x1="660" y1="424" x2="676" y2="424"/><line x1="660" y1="436" x2="676" y2="436"/><line x1="660" y1="448" x2="676" y2="448"/>
  </g>
  <path d="M407 452 L540 436 M540 356 L470 400" stroke="#948b7a" stroke-opacity=".6" stroke-width="1.4" stroke-dasharray="4 5" fill="none"/>

  <!-- EMG signal -->
  <path d="M560 262 l14 0 6 -20 8 40 8 -52 8 52 6 -30 8 10 14 0" stroke="#ff5e1f" stroke-width="2" fill="none" stroke-linejoin="round"/>
  <text x="548" y="296" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="2" fill="#948b7a">EMG SIGNAL IN</text>
  <path d="M600 306 Q600 330 600 330 L600 330 600 410" stroke="#948b7a" stroke-opacity="0" fill="none"/>
  <line x1="600" y1="268" x2="600" y2="252" stroke="#ff5e1f" stroke-opacity="0"/>

  <!-- label -->
  <text x="120" y="88" font-family="'JetBrains Mono',monospace" font-size="13" letter-spacing="3" fill="#948b7a">COMPLIANT GRIPPER &#183; PLA</text>
</svg>
